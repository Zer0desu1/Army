<div style="display: flex; flex-direction: column; gap: 12px;">
  <div class="section-label">🔌 Bağlantı</div>

  <div style="display: flex; gap: 8px;">
    <input
      type="text"
      [(ngModel)]="inputVal"
      placeholder="192.168.1.XXX"
      [disabled]="isOnline || isConnecting"
      (keydown.enter)="!isOnline && handleConnect()"
      style="flex: 1;"
    />

    <button *ngIf="!isOnline && !isConnecting"
      class="btn-primary"
      style="width: auto; padding: 10px 16px; flex-shrink: 0;"
      (click)="handleConnect()">
      Bağlan
    </button>

    <button *ngIf="isConnecting"
      class="btn-danger"
      style="width: auto; padding: 10px 16px; flex-shrink: 0;"
      (click)="disconnect.emit()">
      İptal
    </button>

    <button *ngIf="isOnline"
      class="btn-danger"
      style="width: auto; padding: 10px 16px; flex-shrink: 0;"
      (click)="disconnect.emit()">
      Kes
    </button>
  </div>

  <div class="status-indicator">
    <div class="status-dot" [ngClass]="status"></div>
    <span [style.color]="statusColor" style="font-weight: 600;">{{statusLabel}}</span>
    <span *ngIf="isOnline" style="color: var(--text-muted); font-size: 11px; margin-left: 4px;">
      ws://{{ip}}:81
    </span>
  </div>

  <div style="border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 4px;">
    <button
      class="btn-ghost"
      style="width: 100%; padding: 8px; font-size: 12px; display: flex; align-items: center; justify-content: space-between;"
      (click)="toggleWifiPanel()"
      [disabled]="!isOnline">
      <span>📶 WiFi Yapılandır</span>
      <span style="color: var(--text-muted); font-size: 10px;">
        {{ showWifiPanel ? '▲' : '▼' }}
      </span>
    </button>
    <div *ngIf="!isOnline" style="color: var(--text-muted); font-size: 10px; margin-top: 4px; text-align: center;">
      İlk kez kurulum: Robotun "Cyber" AP'sine bağlanın, IP'ye 192.168.4.1 yazıp Bağlan'a basın.
    </div>

    <div *ngIf="showWifiPanel && isOnline" style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.15); border-radius: 6px;">
      <input
        type="text"
        [(ngModel)]="wifiSsid"
        placeholder="WiFi Adı (SSID)"
        style="font-size: 12px;"
      />
      <input
        type="password"
        [(ngModel)]="wifiPass"
        placeholder="WiFi Şifresi"
        (keydown.enter)="submitWifi()"
        style="font-size: 12px;"
      />
      <div style="display: flex; gap: 6px;">
        <button class="btn-primary" style="flex: 1; padding: 8px; font-size: 12px;"
          (click)="submitWifi()" [disabled]="!wifiSsid.trim()">
          Gönder & Yeniden Başlat
        </button>
        <button class="btn-danger" style="padding: 8px 10px; font-size: 12px;"
          (click)="resetWifi.emit()" title="NVS'i sıfırla, AP moduna dön">
          🔄
        </button>
      </div>
      <div style="font-size: 10px; color: var(--text-muted); line-height: 1.4;">
        Robot ev WiFi'ına geçecek. Yeni IP'yi seri monitörden veya router'dan öğrenip yukarıdaki IP alanına yazın.
      </div>
    </div>
  </div>
</div>
